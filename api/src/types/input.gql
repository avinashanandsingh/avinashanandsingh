input OrderBy {
  column: String!
  asc: Boolean = true
}

input Criteria {
  column: String!
  cop: COP!
  lop: LOP
  value: Object!
}

input Filter {
  criteria: [Criteria!]
  orderBy: [OrderBy!]
  offset: Int
  limit: Int
}

input SignUp {
  first_name: String! @constraint(pattern: "^[a-zA-Z\\s]*$", maxLength: 50)
  last_name: String!
  email: String! @constraint(format: "email", maxLength: 255)
  phone: String!
    @constraint(
      pattern: "^(?:\\+?[1-9]\\d{0,3}[-\\s]?)?(?:\\(\\d{1,5}\\)|\\d{1,5})?[-\\s]?(?:\\d[-\\s]?){6,19}\\d$"
      maxLength: 20
    )
  password: String!
    @constraint(pattern: "^(?=.*\\d)(?=.*[a-z])(?=.*[A-Z]).{8,}", minLength: 8)
}

input SignIn {
  username: String!
  password: String!
}

input UserIn {
  role: UserRole!
  first_name: String! @constraint(pattern: "^[a-zA-Z\\s]*$", maxLength: 50)
  last_name: String!
  email: String! @constraint(format: "email", maxLength: 255)
  phone: String!
    @constraint(
      pattern: "^(?:\\+?[1-9]\\d{0,3}[-\\s]?)?(?:\\(\\d{1,5}\\)|\\d{1,5})?[-\\s]?(?:\\d[-\\s]?){6,19}\\d$"
      maxLength: 20
    )
  file: File
  profession: String
  income: Float
}

input UserStatusIn {
  userid: UUID!
  status: Status!
  reason: String!
}

input ProfileIn {
  first_name: String! @constraint(pattern: "^[a-zA-Z\\s]*$", maxLength: 50)
  last_name: String!
  avatar: String
  about: String
  dob: String
  gender: Gender
  address: String
  countryid: Int
  stateid: Int
  cityid: Int
  postal_code: String
  email: String! @constraint(format: "email", maxLength: 255)
  phone: String!
    @constraint(
      pattern: "^(?:\\+?[1-9]\\d{0,3}[-\\s]?)?(?:\\(\\d{1,5}\\)|\\d{1,5})?[-\\s]?(?:\\d[-\\s]?){6,19}\\d$"
      maxLength: 20
    )
  file: File
  profession: String
  income: Float
}

input CategoryIn {
  name: String!
  slug: String!
  description: String
  file: File
  icon: String
}

input CourseIn {
  categoryid: UUID
  title: String!
  description: String
  about: String
  duration: String!
  validity: Int!
  thumbnail: File!
  video: File
  url: String
  level: String
  certified: Boolean
  free: Boolean
  short: Boolean
  currency: String
  price: Float
  offer: Float
}

input ScheduleIn {
  courseid: UUID!
  title: String!
  start_date: Date!
  end_date: Date!
  start_time: String!
  end_time: String!
  deadline: DateTime!
  capacity: Int = 0
}

input EnrollIn {
  courseid: UUID
  scheduleid: UUID
  enrolledat: DateTime
  expiredat: DateTime
  completedat: DateTime
  certificate_issued_at: DateTime
  droppedat: DateTime
  droppedby: UUID
  notes: String
  qna: JSON
  status: EnrollmentStatus
}

input ImportIn {
  courseid: UUID!
  scheduleid: UUID
  enrolledat: DateTime!
  first_name: String! @constraint(pattern: "^[a-zA-Z\\s]*$", maxLength: 50)
  last_name: String!
  email: String! @constraint(format: "email", maxLength: 255)
  phone: String!
    @constraint(
      pattern: "^(?:\\+?[1-9]\\d{0,3}[-\\s]?)?(?:\\(\\d{1,5}\\)|\\d{1,5})?[-\\s]?(?:\\d[-\\s]?){6,19}\\d$"
      maxLength: 20
    )
}

input DropIn {
  droppedat: DateTime!
  notes: String!
}

input ModuleIn {
  courseid: UUID!
  scheduleid: UUID
  title: String!
  duration: String!
  sort: Int! = 0
  file: File
  url: String
}

input ContentIn {
  context: Context!
  contextid: UUID!
  title: String!
  type: ContentType!
  file: File
  url: String
  content: String
  visible: Boolean = true
  sort: Int! = 0
  duration: Int
}

input ShortIn {
  title: String!
  description: String
  video: File
  url: String
}

input ResourceIn {
  title: String!
  url: String
  file: File
}

input SmtpIn {
  host: String!
  port: Int!
  username: String! @constraint(format: "email", maxLength: 255)
  password: String!
  sender_name: String!
  sender_email: String! @constraint(format: "email", maxLength: 255)
}

input ReactionIn {
  context: Context!
  contextid: UUID!
  liked: Boolean
  disliked: Boolean
}

input TimeslotIn {
  name: String!
  start_time: String!
  end_time: String!
  capacity: Int!
}

input ServiceIn {
  name: String!
  price: Float!
  offer: Float!
  timeslots: [TimeslotIn!]!
}

input SacredvibeIn {
  title: String!
  duration: String!
  url: String
  file: File
}

input ReferralIn {
  first_name: String!
  last_name: String!
  email: String!
  referredat: DateTime!
}

input ReviewIn {
  context: Context!
  contextid: UUID!
  rating: Int!
  content: String!
}

input InquiryIn {
  subject: String
  message: String
}

input MeditationIn {
  courseid: UUID!
  title: String!
  thumbnail: File!
  audio: File
  url: String
  free: Boolean!
  price: Float
  offer: Float
}

input TemplateIn {
  type: String!
  category: String!
  subject: String!
  body: String!
}

input PageIn {
  type: String!
  title: String!
  body: String!
}

input PageFilter {
  id: String
  type: String
}

input BrandingIn {
  type: String!
  title: String!
  content: String
  url: String
  file: File
}

input SettingIn {
  name: String!
  value: String!
}

input OrderIn {
  context: Context
  contextid: UUID
  slotid: UUID
  slot_date: DateTime
  seat: Int
  price: Float
  order_status: OrderStatus = "INITIATED"
  order_status_reason: String
  payment_status: PaymentStatus = "PENDING"
  payment_status_reason: String
  paymentid: String
  orderid: String
  signature: String
  createdat: DateTime
  updatedat: DateTime
}

input OptionIn {
  title: String!
  sort: Int!
}

input QuestionIn {
  courseid: UUID!
  type: String!
  title: String!
  description: String
  options: [OptionIn]!
}

input ReactionIn {
  type: ReactionType!
  context: Context!
  contextid: UUID!
}


input ProgressIn {
  enrollmentId: UUID
  moduleId: UUID
  timeSpent: String!
  completed: Boolean
  completedat: DateTime
}